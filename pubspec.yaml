name: daily_you
description: Every day is worth remembering...
publish_to: 'none'
version: 3.6.0+3006000

environment:
  sdk: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: 
  path_provider: 
  sqflite_common_ffi:
  sqlite3_flutter_libs:
  file_picker: ^13.1.0
  provider: ^6.0.5
  path: ^1.9.0
  permission_handler: ^13.0.2
  image_picker: ^1.0.0
  easy_debounce: ^2.0.3
  system_theme: ^3.1.2
  url_launcher: ^6.1.12
  icons_launcher: ^3.0.0
  flutter_local_notifications: ^22.3.1
  android_alarm_manager_plus: ^5.0.0
  workmanager: ^0.10.10
  flutter_colorpicker: ^1.0.3
  shared_storage:
    git:
      url: https://github.com/Demizo/shared-storage
      ref: release
  share_receiver:
    path: packages/share_receiver
  saf_transfer:
    path: packages/saf_transfer
  backup_crypto:
    path: packages/backup_crypto
  device_info_plus: ^13.3.0
  fl_chart: ^1.2.0
  markdown_widget: ^2.3.2+8

  intl: ^0.20.0
  logging: ^1.3.0
  share_plus: ^13.3.1
  time_range_picker: ^2.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.2
  saf_util: ^3.1.1
  uuid: ^4.5.3
  archive: ^4.0.7
  mime: ^2.0.0
  app_settings: ^9.0.0
  image: ^4.5.4
  flutter_cache_manager: ^3.4.1
  statsfl: ^2.3.0
  pool: ^1.5.1
  flutter_image_compress: ^2.4.0
  html2md: ^1.3.2
  local_auth: ^3.0.1
  crypto: ^3.0.6
  word_count: ^1.0.4
  xml: ^7.0.1
  csv: ^8.0.0
  quick_actions: ^1.1.0
  flutter_displaymode: ^0.7.0
  dynamic_color: ^2.1.0
  flutter_expandable_fab: ^3.0.0
  shamsi_date:
  persian_datetime_picker: ^3.2.0
  markdown: ^7.3.1
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  pointycastle: ^4.0.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mustache_template: ^2.0.5
  yaml: ^3.1.3
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  golden_screenshot: ^12.1.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/daily_you_First_Steps.webp
    - assets/icons/

icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/logo_rectangle.png"
      notification_image: "assets/logo_notification.png"
      adaptive_background_image: "assets/logo_background.png"
      adaptive_foreground_image: "assets/logo_foreground.png"
      adaptive_round_image: "assets/logo_round.png"
      adaptive_monochrome_image: "assets/logo_monochrome.png"
    ios:
      enable: false
      image_path: "assets/logo_rectangle.png"
    macos:
      enable: false
      image_path: "assets/logo_border.png"
    windows:
      enable: false
      image_path: "assets/logo.png"
    linux:
      enable: true
      image_path: "assets/logo.png"
