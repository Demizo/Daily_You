name: performance_hint
description: Raises Android CPU clocks for the Flutter UI and raster threads when the user touches the screen
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.demizo.daily_you.performance_hint
        pluginClass: PerformanceHintPlugin
