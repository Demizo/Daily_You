group = 'com.demizo.daily_you.performance_hint'
version = '1.0'

apply plugin: 'com.android.library'

if (project.findProperty("android.builtInKotlin")?.toString() != "true") {
    apply plugin: "kotlin-android"
}

android {
    namespace = 'com.demizo.daily_you.performance_hint'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
    }
}
