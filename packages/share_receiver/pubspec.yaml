name: share_receiver
description: Receives text and images shared to the app through the Android share sheet
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.demizo.daily_you.share_receiver
        pluginClass: ShareReceiverPlugin
